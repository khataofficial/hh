<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Store</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#111;--soft:#6b6b75;--line:#e4e4e7;--accent:#111;--on:#fff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--ink:#f4f4f5;--soft:#a1a1aa;--line:#2a2a2f;--accent:#f4f4f5;--on:#111}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px}
header small{color:var(--soft)}
#q{width:100%;margin-top:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
main{max-width:1000px;margin:0 auto;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pi{position:relative;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--soft);font-weight:800}
.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pn{font-weight:700;overflow-wrap:anywhere}
.pp{font-weight:800}
.ps{font-size:12px;color:var(--soft)}
.out{font-size:12px;font-weight:800;color:var(--bad)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
button{font:inherit;cursor:pointer}
.add{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:var(--on);font-weight:800}
.add[disabled]{opacity:.35;cursor:not-allowed}
.step{width:36px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:18px;font-weight:800}
.cnt{font-weight:800;min-width:22px;text-align:center}
.empty{text-align:center;color:var(--soft);padding:50px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:none;align-items:center;gap:12px;z-index:6}
#bar .t{flex:1;font-size:13px;color:var(--soft)}#bar .t b{display:block;font-size:20px;color:var(--ink)}
#bar button{padding:14px 24px;border:0;border-radius:12px;background:var(--accent);color:var(--on);font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 10px;font-size:18px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .th{position:relative;width:42px;height:42px;border-radius:10px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--soft);flex-shrink:0}
.line .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.line .d{flex:1;min-width:0;font-size:13px}.line .d b{display:block;font-size:14px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:12px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin:10px 0 4px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}
.row .go{background:var(--accent);color:var(--on);border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.done{text-align:center;padding:10px 0}.done .big{font-size:44px}
a.wa{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:12px;background:#16a34a;color:#fff;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1 id="shop">Online Store</h1>
  <small id="sub">Loading…</small>
  <input id="q" type="search" placeholder="Search products…" autocomplete="off" hidden>
</header>
<main><div id="list"></div></main>
<div id="bar"><div class="t">Your cart<b id="tot">Rs 0</b></div><button id="view">View cart</button></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var esc=function(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;};
  var url=function(u){u=String(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';};
  var rs=function(n){return 'Rs '+Math.round((+n||0)*100)/100;};
  var slug=(new URLSearchParams(location.search).get('s')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30);
  var C=window.KHATA_CFG||{},sb=null,shop=null,cart={};
  try{sb=window.supabase.createClient(C.URL,C.KEY,{auth:{persistSession:false,autoRefreshToken:false}});}catch(e){}

  function thumb(p,cls){var ch=p.emoji||String(p.name||'?').trim().charAt(0).toUpperCase()||'?',u=url(p.img);
    return '<b>'+esc(ch)+'</b>'+(u?'<img src="'+u.replace(/"/g,'%22')+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'');}
  function avail(p){return (+p.price>0)&&(+p.qty>0);}
  function total(){var t=0;(shop.products||[]).forEach(function(p){if(cart[p.id])t+=cart[p.id]*p.price;});return t;}
  function count(){var n=0;for(var k in cart)n+=cart[k];return n;}

  function draw(){
    var q=$('q').value.trim().toLowerCase(),L=(shop.products||[]).filter(function(p){return !q||String(p.name).toLowerCase().indexOf(q)>-1;});
    if(!L.length){$('list').innerHTML='<div class="empty">No products found.</div>';bar();return;}
    $('list').innerHTML='<div class="grid">'+L.map(function(p){
      var n=cart[p.id]||0,ok=avail(p),ctl;
      if(!ok)ctl='<div class="out">'+(+p.price>0?'Out of stock':'Price not set')+'</div><button class="add" disabled>Add</button>';
      else if(!n)ctl='<button class="add" data-a="+" data-id="'+esc(p.id)+'">Add</button>';
      else ctl='<div class="qty"><button class="step" data-a="-" data-id="'+esc(p.id)+'">−</button><span class="cnt">'+n+'</span><button class="step" data-a="+" data-id="'+esc(p.id)+'">+</button></div>';
      return '<div class="p"><div class="pi">'+thumb(p)+'</div><div class="pb"><div class="pn">'+esc(p.name)+'</div><div class="pp">'+(+p.price>0?rs(p.price):'—')+'</div>'+(ok?'<div class="ps">In stock: '+esc(p.qty)+'</div>':'')+ctl+'</div></div>';}).join('')+'</div>';
    bar();
  }
  function bar(){var n=count();$('bar').style.display=n?'flex':'none';$('tot').textContent=rs(total());$('view').textContent='View cart ('+n+')';}
  $('list').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;
    var id=b.getAttribute('data-id'),p=(shop.products||[]).filter(function(x){return String(x.id)===id;})[0];if(!p)return;
    var n=cart[id]||0;if(b.getAttribute('data-a')==='+'){if(n+1>p.qty)return;n++;}else n--;
    if(n<=0)delete cart[id];else cart[id]=n;draw();});
  $('q').addEventListener('input',draw);

  function open(h){$('sheet').innerHTML=h;$('ov').classList.add('on');}
  function close(){$('ov').classList.remove('on');}
  $('ov').addEventListener('click',function(e){if(e.target===$('ov'))close();});
  $('view').onclick=cartView;

  function cartView(){
    var rows=(shop.products||[]).filter(function(p){return cart[p.id];});
    if(!rows.length){close();return;}
    open('<h2>Your cart</h2>'+rows.map(function(p){return '<div class="line"><div class="th">'+thumb(p)+'</div><div class="d"><b>'+esc(p.name)+'</b>'+cart[p.id]+' × '+rs(p.price)+'</div><b>'+rs(cart[p.id]*p.price)+'</b></div>';}).join('')+
      '<div class="tot"><span>Total</span><span>'+rs(total())+'</span></div>'+
      '<label>Your name</label><input id="cn" maxlength="60" autocomplete="name">'+
      '<label>Phone number</label><input id="cp" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="03001234567">'+
      '<label>Address (for delivery)</label><textarea id="ca" rows="2" maxlength="240" autocomplete="street-address"></textarea>'+
      '<div class="err" id="er"></div><div class="row"><button id="cx">Close</button><button class="go" id="co">Place order</button></div>');
    $('cx').onclick=close;
    $('co').onclick=function(){
      var nm=$('cn').value.trim(),ph=$('cp').value.trim(),ad=$('ca').value.trim();
      if(nm.length<2){$('er').textContent='Please enter your name';return;}
      if(ph.replace(/\D/g,'').length<10){$('er').textContent='Please enter a valid phone number';return;}
      var items=Object.keys(cart).map(function(k){return {id:k,qty:cart[k]};});
      $('co').disabled=true;$('co').textContent='Sending…';$('er').textContent='';
      sb.rpc('store_order',{p_slug:slug,p_name:nm,p_phone:ph,p_address:ad,p_items:items}).then(function(r){
        if(r.error){$('co').disabled=false;$('co').textContent='Place order';$('er').textContent=/nothing available/i.test(r.error.message||'')?'Some items are no longer available. Please check your cart.':'Could not send the order. Please try again.';return;}
        var sum=Object.keys(cart).map(function(k){var p=(shop.products||[]).filter(function(x){return String(x.id)===k;})[0];return p?p.name+' x'+cart[k]:'';}).filter(Boolean).join(', ');
        var wa=String(shop.wa||'').replace(/\D/g,'');
        cart={};draw();
        open('<div class="done"><div class="big">✅</div><h2>Order sent!</h2><p>'+esc(shop.name||'The shop')+' will contact you soon on '+esc(ph)+'.</p></div>'+
          (wa?'<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent('Hi, I placed an order on your online store ('+sum+'). My name is '+nm+'.')+'">Message the shop on WhatsApp</a>':'')+
          '<div class="row"><button id="cx">Close</button></div>');
        $('cx').onclick=close;
      }).catch(function(){$('co').disabled=false;$('co').textContent='Place order';$('er').textContent='No internet connection. Please try again.';});
    };
  }

  function fail(m){$('sub').textContent=m;$('list').innerHTML='<div class="empty">'+esc(m)+'</div>';}
  if(!slug||!sb||!C.URL){fail('This store link is not valid.');return;}
  sb.rpc('store_get',{p_slug:slug}).then(function(r){
    if(r.error||!r.data){fail('This store is not available right now.');return;}
    shop=r.data;document.title=(shop.name||'Online Store');$('shop').textContent=shop.name||'Online Store';
    $('sub').textContent='Order online · we will contact you';$('q').hidden=false;draw();
  }).catch(function(){fail('No internet connection.');});
})();
</script>
</body>
</html>
